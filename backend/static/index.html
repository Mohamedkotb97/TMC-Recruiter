        toast("Key revealed — copy it into the extension");
      } else {
        toast("No key returned — try Regenerate", true);
      }
    } catch (e) { toast("Failed: " + e.message, true); }
    revealBtn.disabled = false;
  });
  const copyBtn = document.getElementById("copyApiKey");
  if (copyBtn) copyBtn.addEventListener("click", async () => {
    const fld = document.getElementById("myApiKeyField");
    if (!fld.value) { toast("Click Reveal first", true); return; }
    try { await navigator.clipboard.writeText(fld.value); toast("Extension key copied"); }
    catch { fld.select(); document.execCommand("copy"); toast("Copied"); }
  });
  const rotateBtn = document.getElementById("rotateApiKey");
  if (rotateBtn) rotateBtn.addEventListener("click", async () => {
    if (!confirm("Regenerate your extension key?\n\nThe old key stops working immediately — you'll need to paste the new key into the Chrome extension popup.")) return;
    try {
      const r = await api("/api/auth/api_key/rotate", { method: "POST" });
      ME.api_key = r.api_key;
      document.getElementById("myApiKeyField").value = r.api_key;
      toast("New key generated — update the extension now");
    } catch (e) { toast("Failed: " + e.message, true); }
  });
}
function openAddUserModal() {
  showModal(`
    <h2>Add teammate</h2>
    <div class="form-grid">
      <div><label class="label">Username</label><input class="input" id="u_username"></div>
      <div><label class="label">Display name</label><input class="input" id="u_display"></div>
      <div><label class="label">Email</label><input class="input" id="u_email"></div>
      <div><label class="label">Role</label><select class="input" id="u_role"><option>recruiter</option><option>admin</option></select></div>
      <div><label class="label">Initial password</label><input class="input" id="u_pass" type="password"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="hideModal()">Cancel</button><button class="btn btn-primary" id="u_save">Create</button></div>
  `);
  document.getElementById("u_save").addEventListener("click", async () => {
    try {
      await api("/api/auth/users", { method: "POST", body: JSON.stringify({
        username: document.getElementById("u_username").value.trim(),
        display_name: document.getElementById("u_display").value.trim(),
        email: document.getElementById("u_email").value.trim(),
        role: document.getElementById("u_role").value,
        password: document.getElementById("u_pass").value,
      })});
      hideModal(); toast("User created"); await boot();
    } catch (e) { toast("Failed: " + e.message, true); }
  });
}

/* ============================================================
   VIEW: Admin — user management + workspace stats
   ============================================================ */
async function renderAdminView(root) {
  if (!ME || !ME.is_admin) {
    root.innerHTML = `<div class="card"><h2>Admin only</h2><p>You need admin permissions to see this page.</p></div>`;
    return;
  }
  root.innerHTML = `<div class="card"><p>Loading admin dashboard...</p></div>`;
  let stats = {}, usersRes = { users: [] };
  try {
    [stats, usersRes] = await Promise.all([
      api("/api/admin/stats"),
      api("/api/admin/users"),
    ]);
  } catch (e) {
    root.innerHTML = `<div class="card"><h2>Failed to load</h2><p>${esc(e.message)}</p></div>`;
    return;
  }
  const users = usersRes.users || [];
  const settings = STATE.settings || {};
  const allowRegister = settings.allow_self_register?.value === "1";
  const autoApprove   = settings.auto_approve_signups?.value === "1";

  root.innerHTML = `
    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:14px;">
      ${[
        ["Users total", stats.users_total],
        ["Active users", stats.users_active],
        ["Candidates", stats.candidates],
        ["Conversations", stats.conversations],
        ["Messages", stats.messages],
        ["Roles", stats.roles],
        ["Briefs done", stats.analyses_done],
        ["Briefs pending", stats.analyses_pending],
        ["Briefs failed", stats.analyses_failed],
      ].map(([label, val]) => `
        <div class="card" style="text-align:center;">
          <div style="font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;">${esc(label)}</div>
          <div style="font-size:28px;font-weight:700;color:var(--tmc-navy);">${val || 0}</div>
        </div>
      `).join("")}
    </div>

    <div class="card" style="margin-bottom:14px;">
      <h2 style="margin-top:0;">Public sign-ups</h2>
      <p style="font-size:12px;color:var(--mute);">Turn on to let strangers create accounts (for when you publish the extension). Leave <em>auto-approve</em> off to manually activate each new user.</p>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
        <label style="display:flex;gap:6px;align-items:center;cursor:pointer;">
          <input type="checkbox" id="tgSelfRegister" ${allowRegister ? "checked" : ""}> Allow self-registration
        </label>
        <label style="display:flex;gap:6px;align-items:center;cursor:pointer;">
          <input type="checkbox" id="tgAutoApprove" ${autoApprove ? "checked" : ""}> Auto-approve new accounts
        </label>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h2 style="margin:0;">Users (${users.length})</h2>
        <button class="btn btn-primary btn-sm" id="adminAddUserBtn">+ New user</button>
      </div>
      <table>
        <thead><tr>
          <th>User</th><th>Role</th><th>Email</th>
          <th style="text-align:right;">Candidates</th>
          <th style="text-align:right;">Threads</th>
          <th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${users.map(u => `
            <tr data-user-id="${u.id}">
              <td><strong>${esc(u.display_name || u.username)}</strong><div style="color:var(--mute);font-size:11px;">@${esc(u.username)}</div></td>
              <td><span class="chip ${u.is_admin ? 'chip-gold' : 'chip-outline'}">${u.is_admin ? 'admin' : esc(u.role || 'recruiter')}</span></td>
              <td style="font-size:12px;color:var(--mute);">${esc(u.email || '')}</td>
              <td style="text-align:right;">${u.candidate_count || 0}</td>
              <td style="text-align:right;">${u.conversation_count || 0}</td>
              <td>${u.is_active
                ? '<span class="chip chip-ok">active</span>'
                : '<span class="chip chip-warn">pending</span>'}</td>
              <td style="white-space:nowrap;">
                ${u.id !== (ME && ME.id)
                  ? `<button class="btn btn-navy btn-sm" data-act="viewas" data-id="${u.id}" title="Open Inbox / People / Stats filtered to this user">View inbox</button>`
                  : ''}
                <button class="btn btn-ghost btn-sm" data-act="showkey" data-id="${u.id}" title="Reveal this user's Chrome-extension key">Show key</button>
                ${u.is_active
                  ? `<button class="btn btn-ghost btn-sm" data-act="deactivate" data-id="${u.id}">Suspend</button>`
                  : `<button class="btn btn-gold btn-sm" data-act="activate" data-id="${u.id}">Approve</button>`}
                ${u.is_admin
                  ? `<button class="btn btn-ghost btn-sm" data-act="demote" data-id="${u.id}">Demote</button>`
                  : `<button class="btn btn-ghost btn-sm" data-act="promote" data-id="${u.id}">Make admin</button>`}
                <button class="btn btn-ghost btn-sm" data-act="reset" data-id="${u.id}">Reset pw</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById("tgSelfRegister").addEventListener("change", async (e) => {
    await api("/api/settings", { method: "POST", body: JSON.stringify({ key: "allow_self_register", value: e.target.checked ? "1" : "0" }) });
    toast("Saved"); await boot();
  });
  document.getElementById("tgAutoApprove").addEventListener("change", async (e) => {
    await api("/api/settings", { method: "POST", body: JSON.stringify({ key: "auto_approve_signups", value: e.target.checked ? "1" : "0" }) });
    toast("Saved"); await boot();
  });
  document.getElementById("adminAddUserBtn").addEventListener("click", () => openAddUserModal());

  document.querySelectorAll("[data-act]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.id, act = btn.dataset.act;

    // Enter impersonation mode: switch to Inbox scoped to this user.
    if (act === "viewas") {
      const u = users.find(x => x.id === Number(id));
      if (!u) return toast("User not found", true);
      setViewAs(Number(id), u);
      switchView("dashboard");
      return;
    }

    // Reveal a user's personal extension key so the admin can share it.
    if (act === "showkey") {
      try {
        const r = await api(`/api/admin/users/${id}/api_key`);
        showModal(`
          <h2 style="margin-top:0;">Extension key for ${esc(r.username)}</h2>
          <p style="font-size:12px;color:var(--mute);">This is the user's personal Chrome-extension key. Paste it into the extension popup under <strong>API key</strong>. The global <code>CRM_API_KEY</code> will NOT work for the extension.</p>
          <input class="input" readonly value="${esc(r.api_key)}" id="revealKeyInput" style="font-family:monospace;font-size:12px;">
          <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end;">
            <button class="btn btn-ghost btn-sm" id="revealCopyBtn">Copy</button>
            <button class="btn btn-ghost btn-sm" id="revealRotateBtn" style="color:#a33;">Rotate key</button>
            <button class="btn btn-navy btn-sm" id="revealCloseBtn">Close</button>
          </div>
        `);
        document.getElementById("revealCopyBtn").addEventListener("click", async () => {
          await navigator.clipboard.writeText(r.api_key);
          toast("Key copied to clipboard");
        });
        document.getElementById("revealCloseBtn").addEventListener("click", hideModal);
        document.getElementById("revealRotateBtn").addEventListener("click", async () => {
          if (!confirm("Rotate this user's key? Their extension will stop working until they paste the new one.")) return;
          try {
            const nw = await api(`/api/admin/users/${id}/api_key/rotate`, { method: "POST" });
            document.getElementById("revealKeyInput").value = nw.api_key;
            toast("Key rotated — send the new one to the user.");
          } catch (e) { toast("Rotate failed: " + e.message, true); }
        });
      } catch (e) { toast("Failed: " + e.message, true); }
      return;
    }

    const body = {};
    if (act === "activate")   body.is_active = true;
    if (act === "deactivate") body.is_active = false;
    if (act === "promote")    body.is_admin  = true;
    if (act === "demote")     body.is_admin  = false;
    if (act === "reset") {
      const pw = prompt("New password for this user:");
      if (!pw) return;
      body.reset_password = pw;
    }
    try {
      await api(`/api/admin/users/${id}`, { method: "PATCH", body: JSON.stringify(body) });
      toast("Updated"); renderAdminView(root);
    } catch (e) { toast("Failed: " + e.message, true); }
  }));
}

/* ============================================================
   Cmd+K palette
   ============================================================ */
function openPalette() {
  document.getElementById("paletteBg").classList.add("show");
  const input = document.getElementById("paletteInput");
  input.value = ""; input.focus();
  document.getElementById("paletteResults").innerHTML = '<div class="empty">Start typing...</div>';
}
function closePalette() { document.getElementById("paletteBg").classList.remove("show"); }
document.getElementById("paletteBg").addEventListener("click", e => { if (e.target.id === "paletteBg") closePalette(); });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); openPalette(); }
  if (e.key === "Escape") { closePalette(); hideModal(); }
});
let paletteResults = [];
let paletteHl = 0;
document.getElementById("paletteInput").addEventListener("input", async e => {
  const q = e.target.value.trim();
  if (!q) { document.getElementById("paletteResults").innerHTML = '<div class="empty">Start typing...</div>'; return; }
  clearTimeout(window._pt);
  window._pt = setTimeout(async () => {
    try {
      const res = await api(`/api/search?q=${encodeURIComponent(q)}`);
      paletteResults = [];
      (res.candidates || []).forEach(x => paletteResults.push({ ...x, type: "candidate", label: x.full_name, sub: x.subtitle }));
      (res.roles || []).forEach(x => paletteResults.push({ ...x, type: "role", label: x.title, sub: x.subtitle }));
      (res.pools || []).forEach(x => paletteResults.push({ ...x, type: "pool", label: x.name, sub: `${x.count} members` }));
      (res.templates || []).forEach(x => paletteResults.push({ ...x, type: "template", label: x.name, sub: x.subtitle }));
      paletteHl = 0;
      renderPaletteResults();
    } catch (err) {}
  }, 160);
});
function renderPaletteResults() {
  const container = document.getElementById("paletteResults");
  if (!paletteResults.length) { container.innerHTML = '<div class="empty">No results.</div>'; return; }
  const groups = {};
  paletteResults.forEach(r => { groups[r.type] = groups[r.type] || []; groups[r.type].push(r); });
  let html = "";
  let idx = 0;
  Object.keys(groups).forEach(type => {
    html += `<div class="palette-section">${type}s</div>`;
    groups[type].forEach(item => {
      html += `<div class="palette-item ${idx === paletteHl ? 'hl' : ''}" data-idx="${idx}" data-type="${item.type}" data-id="${item.id}">
        <div><strong>${esc(item.label)}</strong><div class="pi-sub">${esc(item.sub || '')}</div></div>
        <span class="chip chip-outline" style="opacity:.6;">${type}</span>
      </div>`;
      idx++;
    });
  });
  container.innerHTML = html;
  container.querySelectorAll(".palette-item").forEach(el => el.addEventListener("click", () => openPaletteItem(parseInt(el.dataset.idx))));
}
async function openPaletteItem(i) {
  const item = paletteResults[i];
  if (!item) return;
  closePalette();
  if (item.type === "candidate") { STATE.currentCandidate = await api(`/api/candidates/${item.id}`); switchView("candidates"); }
  else if (item.type === "role") { STATE.currentRole = await api(`/api/roles/${item.id}`); switchView("roles"); }
  else if (item.type === "pool") { STATE.candidateFilter.pool_id = String(item.id); switchView("candidates"); }
  else if (item.type === "template") { switchView("templates"); }
}
document.getElementById("paletteInput").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { paletteHl = Math.min(paletteResults.length - 1, paletteHl + 1); renderPaletteResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { paletteHl = Math.max(0, paletteHl - 1); renderPaletteResults(); e.preventDefault(); }
  else if (e.key === "Enter") { openPaletteItem(paletteHl); }
});

/* ============================================================
   Boot + periodic refresh
   ============================================================ */
if (SESSION_TOKEN) { boot(); } else { showSetup(); }
setInterval(() => { if (SESSION_TOKEN && !document.hidden) boot(); }, 60000);
</script>
