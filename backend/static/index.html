<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMC · Recruiter Workspace — Habib Touil</title>
<link rel="icon" href="/tmc_logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --tmc-navy: #0a1b3c; --tmc-navy-2: #122a55; --tmc-navy-3: #1a3a6b;
    --tmc-ink: #0a1226; --tmc-paper: #f5f6fa; --tmc-paper-2: #eaecf3;
    --tmc-paper-3: #dde1ec; --tmc-gold: #e4b53a; --tmc-gold-soft: #f6e3a6;
    --tmc-accent: #2563eb; --tmc-accent-soft: #dbeafe; --tmc-white: #ffffff;
    --mute: #6b7289; --mute-2: #9aa0b4; --line: #d9dde8;
    --ok: #0f7b3e; --ok-soft: #d1fae5;
    --warn: #b55a00; --warn-soft: #fef3c7;
    --bad: #a11d1d; --bad-soft: #fee2e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; background: var(--tmc-paper); color: var(--tmc-ink); font-size: 14px; line-height: 1.5; }
  a { color: var(--tmc-accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  input, textarea, select, button { font-family: inherit; }
  code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: var(--tmc-paper-2); padding: 2px 5px; border-radius: 4px; }

  .app { display: grid; grid-template-columns: 72px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 900px) { .app { grid-template-columns: 56px minmax(0, 1fr); } }

  /* ============ Left nav ============ */
  .nav { background: var(--tmc-navy); color: var(--tmc-paper); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 2px; border-right: 1px solid var(--tmc-navy-2); position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; }
  .nav::-webkit-scrollbar { width: 0; }
  .nav-logo { width: 44px; height: 44px; border-radius: 8px; object-fit: contain; margin-bottom: 8px; }
  .nav-item { width: 60px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; color: var(--mute-2); cursor: pointer; font-size: 9px; letter-spacing: 0.04em; gap: 3px; position: relative; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; border: none; background: transparent; padding: 4px 2px; text-align: center; line-height: 1.15; }
  .nav-item .nav-icon { font-size: 19px; line-height: 1; }
  .nav-item:hover { color: var(--tmc-white); background: var(--tmc-navy-2); }
  .nav-item.active { color: var(--tmc-ink); background: var(--tmc-gold); }
  .nav-item .nav-badge { position: absolute; top: 4px; right: 4px; background: var(--tmc-gold); color: var(--tmc-ink); font-size: 9px; font-weight: 700; border-radius: 8px; padding: 1px 5px; min-width: 16px; text-align: center; }
  .nav-item.active .nav-badge { background: var(--tmc-ink); color: var(--tmc-gold); }
  .nav-spacer { flex: 1; min-height: 12px; }
  @media (max-width: 900px) {
    .nav-logo { width: 36px; height: 36px; }
    .nav-item { width: 50px; min-height: 48px; font-size: 8px; }
    .nav-item .nav-icon { font-size: 17px; }
    .nav-item span:not(.nav-icon):not(.nav-badge) { display: none; }
  }

  /* ============ Main region ============ */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { background: var(--tmc-white); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; gap: 16px; }
  .topbar h1 { font-size: 17px; font-weight: 700; margin: 0; color: var(--tmc-navy); }
  .topbar .sub { color: var(--mute); font-size: 11px; font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.05em; margin-top: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .search-trigger { display: flex; align-items: center; gap: 8px; background: var(--tmc-paper); border: 1px solid var(--line); padding: 6px 11px; border-radius: 8px; color: var(--mute); cursor: pointer; font-size: 12px; }
  .search-trigger kbd { font-family: 'IBM Plex Mono', monospace; background: var(--tmc-white); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; font-size: 10px; }
  .owner-chip { background: var(--tmc-navy); color: var(--tmc-gold); padding: 4px 9px; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; white-space: nowrap; }
  @media (max-width: 700px) { .topbar { padding: 10px 14px; } .search-trigger span:not(kbd) { display: none; } }

  .view { padding: 20px 28px 48px 28px; max-width: 1400px; margin: 0 auto; width: 100%; }
  @media (max-width: 900px) { .view { padding: 14px 14px 40px 14px; } }

  /* ============ Buttons ============ */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 13px; background: var(--tmc-white); color: var(--tmc-ink); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .12s; }
  .btn:hover { background: var(--tmc-paper-2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--tmc-navy); color: var(--tmc-white); border-color: var(--tmc-navy); }
  .btn-primary:hover { background: var(--tmc-navy-3); }
  .btn-gold { background: var(--tmc-gold); color: var(--tmc-ink); border-color: var(--tmc-gold); }
  .btn-gold:hover { background: var(--tmc-gold-soft); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--tmc-ink); }
  .btn-ghost:hover { background: var(--tmc-paper-2); }
  .btn-danger { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-soft); }
  .btn-sm { padding: 5px 9px; font-size: 12px; }

  /* ============ KPI / Cards ============ */
  .kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .kpi-strip.compact { margin-bottom: 14px; }
  .kpi-strip.compact .kpi { padding: 10px 12px; }
  .kpi-strip.compact .kpi-value { font-size: 20px; }

  /* ============ Inbox (home view) ============ */
  .inbox-wrap { display: grid; grid-template-columns: minmax(0, 2.3fr) minmax(220px, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 960px) { .inbox-wrap { grid-template-columns: 1fr; } }
  .inbox-left { background: var(--tmc-white); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .inbox-right { display: flex; flex-direction: column; gap: 14px; }
  .inbox-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .inbox-toolbar { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; background: var(--tmc-paper); }
  .inbox-search { max-width: 340px; flex: 1; min-width: 200px; }
  .inbox-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .inbox-tab { padding: 5px 11px; background: var(--tmc-white); border: 1px solid var(--line); border-radius: 999px; font-size: 11px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; letter-spacing: .04em; color: var(--mute); transition: all .15s; }
  .inbox-tab:hover { border-color: var(--tmc-navy); color: var(--tmc-navy); }
  .inbox-tab.active { background: var(--tmc-navy); color: var(--tmc-white); border-color: var(--tmc-navy); }
  .inbox-list { max-height: 72vh; overflow-y: auto; }
  .inbox-row { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; transition: background .1s; }
  .inbox-row:hover { background: var(--tmc-paper); }
  .inbox-row.unread { background: linear-gradient(90deg, rgba(212,175,55,.06), transparent 60%); }
  .inbox-row.unread .inbox-name { font-weight: 700; }
  .inbox-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--tmc-navy); color: var(--tmc-gold); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; }
  .inbox-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .inbox-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .inbox-name { font-weight: 600; font-size: 14px; color: var(--tmc-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inbox-when { font-size: 11px; color: var(--mute); flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; }
  .inbox-sub { font-size: 11px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inbox-preview { font-size: 12.5px; color: var(--tmc-ink); line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .inbox-tags { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
  .inbox-dot { position: absolute; top: 18px; right: 16px; width: 9px; height: 9px; background: var(--tmc-gold); border-radius: 50%; box-shadow: 0 0 0 3px rgba(212,175,55,.22); }
  
  .kpi { background: var(--tmc-white); padding: 13px 15px; border-radius: 10px; border: 1px solid var(--line); }
  .kpi-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 5px; }
  .kpi-value { font-size: 24px; font-weight: 700; color: var(--tmc-navy); line-height: 1; }
  .kpi-value .unit { font-size: 13px; color: var(--mute); font-weight: 500; margin-left: 3px; }
  .kpi-sub { font-size: 11px; color: var(--mute); margin-top: 5px; }
  .kpi.accent { background: var(--tmc-navy); color: var(--tmc-white); border-color: var(--tmc-navy); }
  .kpi.accent .kpi-label { color: var(--tmc-gold); }
  .kpi.accent .kpi-value { color: var(--tmc-white); }
  .kpi.accent .kpi-sub { color: var(--mute-2); }

  .card { background: var(--tmc-white); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px 0; color: var(--tmc-navy); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h3 { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--mute); margin: 0 0 10px 0; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); font-family: 'IBM Plex Mono', monospace; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  tr:hover td { background: var(--tmc-paper); }
  tr:last-child td { border-bottom: none; }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; letter-spacing: .05em; background: var(--tmc-paper-2); color: var(--tmc-ink); border: 1px solid transparent; }
  .chip-navy { background: var(--tmc-navy); color: var(--tmc-white); }
  .chip-gold { background: var(--tmc-gold); color: var(--tmc-ink); font-weight: 600; }
  .chip-ok { background: var(--ok-soft); color: var(--ok); }
  .chip-warn { background: var(--warn-soft); color: var(--warn); }
  .chip-bad { background: var(--bad-soft); color: var(--bad); }
  .chip-outline { background: transparent; border-color: var(--line); color: var(--mute); }

  .fit-pill { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; font-weight: 700; font-size: 13px; color: var(--tmc-white); background: var(--mute); flex-shrink: 0; }
  .fit-90 { background: #166534; } .fit-75 { background: #15803d; } .fit-60 { background: #a16207; } .fit-40 { background: #b45309; } .fit-0 { background: #991b1b; }

  .input, .textarea, select { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--tmc-white); font-size: 13px; color: var(--tmc-ink); outline: none; transition: border-color .15s; }
  .input:focus, .textarea:focus, select:focus { border-color: var(--tmc-navy); }
  .textarea { resize: vertical; min-height: 90px; font-family: inherit; line-height: 1.55; }
  .label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); margin-bottom: 5px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }

  .split { display: grid; grid-template-columns: 380px 1fr; gap: 18px; align-items: flex-start; }
  .list-panel { background: var(--tmc-white); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 160px); position: sticky; top: 90px; }
  .list-panel .filters { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 5px; flex-wrap: wrap; }
  .list-panel .search { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; }
  .list-panel .search input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
  .candidate-list { flex: 1; overflow-y: auto; }
  .candidate-item { padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .1s; }
  .candidate-item:hover { background: var(--tmc-paper); }
  .candidate-item.active { background: var(--tmc-navy); color: var(--tmc-white); }
  .candidate-item.active .ci-sub { color: var(--tmc-gold-soft); }
  .candidate-item.active .ci-meta { color: var(--tmc-gold); }
  .ci-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .ci-name { font-weight: 600; font-size: 13px; }
  .ci-src { font-size: 9px; color: var(--mute-2); font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: .06em; }
  .ci-sub { font-size: 11px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 2px 0 3px; }
  .ci-meta { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .08em; color: var(--mute); display: flex; gap: 8px; text-transform: uppercase; flex-wrap: wrap; }

  .profile-card { background: linear-gradient(135deg, var(--tmc-navy) 0%, var(--tmc-navy-3) 100%); color: var(--tmc-white); padding: 20px 24px; border-radius: 14px; margin-bottom: 16px; }
  .profile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .profile-name { font-size: 22px; font-weight: 700; margin: 0 0 3px 0; }
  .profile-name[contenteditable="true"] { outline: 1px dashed rgba(255,255,255,0.3); border-radius: 4px; padding: 0 4px; }
  .profile-headline { color: var(--tmc-gold-soft); font-size: 13px; margin-bottom: 6px; }
  .profile-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .profile-chips .chip { background: rgba(255,255,255,0.10); color: var(--tmc-paper); border: 1px solid rgba(255,255,255,0.12); }
  .profile-chips .chip.chip-gold { background: var(--tmc-gold); color: var(--tmc-ink); border: none; }
  .profile-about { font-size: 12px; color: var(--tmc-paper-3); margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); line-height: 1.5; }
  .stage-select { padding: 7px 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: rgba(255,255,255,0.08); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tmc-white); cursor: pointer; min-width: 150px; }
  .stage-select option { color: var(--tmc-ink); }

  .msg { padding: 9px 12px; margin-bottom: 6px; border-radius: 10px; background: var(--tmc-paper-2); }
  .msg-recruiter { background: var(--tmc-navy); color: var(--tmc-white); margin-left: 32px; }
  .msg-candidate { margin-right: 32px; }
  .msg-sender { font-size: 10px; font-weight: 600; margin-bottom: 3px; opacity: .7; }
  .msg-body { font-size: 13px; white-space: pre-wrap; }

  .draft-box { background: var(--tmc-navy); color: var(--tmc-paper); border-radius: 12px; padding: 16px; margin-top: 10px; }
  .draft-box textarea { width: 100%; min-height: 110px; padding: 10px 12px; border-radius: 6px; background: var(--tmc-navy-2); color: var(--tmc-paper); border: 1px solid transparent; font-size: 13px; line-height: 1.55; resize: vertical; outline: none; }
  .draft-box textarea:focus { border-color: var(--tmc-gold); }
  .tone-row { display: flex; gap: 5px; margin-bottom: 9px; flex-wrap: wrap; }
  .tone-row .chip { cursor: pointer; background: transparent; border: 1px solid var(--tmc-navy-3); color: var(--tmc-paper); }
  .tone-row .chip.active { background: var(--tmc-gold); color: var(--tmc-ink); border-color: var(--tmc-gold); }
  .draft-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

  .kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .kanban-col { background: var(--tmc-paper-2); border-radius: 12px; padding: 10px; min-height: 300px; }
  .kanban-card { position: relative; }
  .kc-remove { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,0.08); color: var(--mute); font-weight: 700; cursor: pointer; line-height: 1; padding: 0; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .kc-remove:hover { background: var(--bad); color: var(--tmc-white); }
  .kanban-col.drag-over { background: var(--tmc-gold-soft); }
  .kanban-col h3 { margin: 0 0 8px 0; font-size: 10px; display: flex; justify-content: space-between; }
  .kanban-col h3 span.count { background: var(--tmc-navy); color: var(--tmc-white); padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .kanban-card { background: var(--tmc-white); padding: 9px 11px; border-radius: 8px; margin-bottom: 6px; cursor: grab; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .kanban-card:hover { border-color: var(--tmc-navy); }
  .kanban-card.dragging { opacity: .4; }
  .kanban-card .kc-name { font-weight: 600; font-size: 12px; margin-bottom: 2px; }
  .kanban-card .kc-sub { font-size: 10px; color: var(--mute); }

  .modal-bg { position: fixed; inset: 0; background: rgba(10,18,38,0.6); z-index: 900; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--tmc-white); border-radius: 14px; padding: 24px 26px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .modal img.modal-logo { width: 40px; height: 40px; border-radius: 8px; margin-bottom: 10px; }
  .modal h2 { margin: 0 0 4px 0; color: var(--tmc-navy); font-size: 20px; }
  .modal p { color: var(--mute); margin-bottom: 14px; font-size: 13px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--tmc-navy); color: var(--tmc-white); padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all .25s; z-index: 1200; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 80%; }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--bad); }

  .empty { padding: 36px; text-align: center; color: var(--mute); font-size: 13px; }
  .empty img { width: 56px; opacity: .8; margin-bottom: 10px; border-radius: 10px; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--mute-2); border-top-color: var(--tmc-navy); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .badge-risk { background: var(--bad-soft); color: var(--bad); padding: 2px 7px; border-radius: 4px; font-size: 10px; font-family: 'IBM Plex Mono', monospace; margin-right: 4px; display: inline-block; margin-top: 3px; }
  .badge-evidence { background: var(--ok-soft); color: var(--ok); padding: 2px 7px; border-radius: 4px; font-size: 11px; margin-right: 4px; display: inline-block; margin-top: 3px; }

  .label-interested { background: var(--ok-soft); color: var(--ok); }
  .label-maybe_later { background: var(--warn-soft); color: var(--warn); }
  .label-send_jd { background: var(--tmc-accent-soft); color: var(--tmc-accent); }
  .label-salary_mismatch, .label-location_mismatch, .label-not_interested, .label-no_longer_available { background: var(--bad-soft); color: var(--bad); }
  .label-needs_more_info { background: var(--warn-soft); color: var(--warn); }
  .label-refer_someone { background: var(--tmc-accent-soft); color: var(--tmc-accent); }
  .label-already_in_process, .label-other { background: var(--tmc-paper-2); color: var(--mute); }

  /* ============ Cmd+K palette ============ */
  .palette-bg { position: fixed; inset: 0; background: rgba(10,18,38,0.55); z-index: 1000; display: none; padding-top: 120px; justify-content: center; }
  .palette-bg.show { display: flex; }
  .palette { background: var(--tmc-white); border-radius: 12px; width: 640px; max-width: 94%; max-height: 70vh; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); display: flex; flex-direction: column; }
  .palette input { border: 0; padding: 16px 20px; font-size: 15px; outline: none; border-bottom: 1px solid var(--line); }
  .palette-results { flex: 1; overflow-y: auto; }
  .palette-section { padding: 8px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .12em; color: var(--mute); text-transform: uppercase; background: var(--tmc-paper); }
  .palette-item { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--tmc-paper-2); }
  .palette-item:hover, .palette-item.hl { background: var(--tmc-navy); color: var(--tmc-white); }
  .palette-item .pi-sub { font-size: 11px; color: var(--mute-2); }
  .palette-item:hover .pi-sub, .palette-item.hl .pi-sub { color: var(--tmc-gold-soft); }

  /* Onboarding */
  .onboard-step { padding: 16px 18px; background: var(--tmc-paper); border-radius: 10px; border: 1px solid var(--line); margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start; }
  .onboard-step.done { background: var(--ok-soft); border-color: var(--ok-soft); }
  .onboard-num { width: 28px; height: 28px; border-radius: 50%; background: var(--tmc-navy); color: var(--tmc-white); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .onboard-step.done .onboard-num { background: var(--ok); }

  /* Inline editable */
  [contenteditable="true"]:hover { background: var(--tmc-paper-2); border-radius: 4px; }
  [contenteditable="true"]:focus { outline: 2px solid var(--tmc-navy); background: var(--tmc-white); }

  .pill-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: var(--tmc-accent-soft); color: var(--tmc-accent); font-size: 11px; margin-right: 4px; margin-top: 4px; }
  .pill-tag .x { cursor: pointer; font-weight: 700; color: var(--tmc-accent); opacity: .6; }
  .pill-tag .x:hover { opacity: 1; }

  .funnel-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .funnel-row:last-child { border-bottom: none; }
  .funnel-label { width: 120px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--mute); letter-spacing: .08em; }
  .funnel-bar { flex: 1; height: 22px; background: var(--tmc-paper-2); border-radius: 6px; overflow: hidden; position: relative; }
  .funnel-fill { height: 100%; background: linear-gradient(90deg, var(--tmc-navy), var(--tmc-accent)); }
  .funnel-num { min-width: 80px; text-align: right; font-weight: 700; color: var(--tmc-navy); }
  .funnel-pct { min-width: 60px; text-align: right; color: var(--mute); font-size: 12px; }
</style>
</head>

<script>
const API = "";
let SESSION_TOKEN = localStorage.getItem("tmc_session") || "";
let ME = null;
let STATE = {
  view: "dashboard",
  stats: null,
  candidates: [],
  currentCandidate: null,
  roles: [],
  currentRole: null,
  templates: [],
  replies: [],
  tasks: [],
  pools: [],
  campaigns: [],
  currentCampaign: null,
  settings: {},
  users: [],
  candidateFilter: { stage: "", q: "", location: "", skill: "", pool_id: "" },
  // Admin impersonation: when set, boot() asks the backend to scope Inbox /
  // People / Stats as if we were user viewAsUserId. Persisted in localStorage
  // so a refresh doesn't silently drop back to the admin's own view.
  viewAsUserId: Number(localStorage.getItem("tmc_view_as") || 0) || null,
  viewAsUser: null,
};

/* Append ?as_user_id=N when an admin is impersonating. Non-admins ignore this. */
function asUserQS(prefix = "?") {
  if (ME && ME.is_admin && STATE.viewAsUserId) {
    return `${prefix}as_user_id=${STATE.viewAsUserId}`;
  }
  return "";
}
function setViewAs(userId, userObj) {
  if (userId) {
    STATE.viewAsUserId = userId;
    STATE.viewAsUser = userObj || null;
    localStorage.setItem("tmc_view_as", String(userId));
  } else {
    STATE.viewAsUserId = null;
    STATE.viewAsUser = null;
    localStorage.removeItem("tmc_view_as");
  }
  boot();
}

/* ============ Auth + API ============ */
function showSetup() { document.getElementById("setupModal").style.display = "flex"; }
function hideSetup() { document.getElementById("setupModal").style.display = "none"; }

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (SESSION_TOKEN) headers["X-Session-Token"] = SESSION_TOKEN;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) {
    localStorage.removeItem("tmc_session");
    SESSION_TOKEN = "";
    showSetup();
    throw new Error("Unauthorized");
  }
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const j = await res.json(); if (j.detail) msg = j.detail; } catch {}
    throw new Error(msg);
  }
  if (res.headers.get("content-type")?.includes("application/json")) return res.json();
  return res;
}

/* --- Auth tabs --- */
function showAuthTab(which) {
  const isLogin = which === "login";
  document.getElementById("loginPane").style.display = isLogin ? "block" : "none";
  document.getElementById("registerPane").style.display = isLogin ? "none" : "block";
  document.getElementById("tabLogin").classList.toggle("active", isLogin);
  document.getElementById("tabRegister").classList.toggle("active", !isLogin);
  document.getElementById("authTitle").textContent = isLogin ? "Sign in to TMC Recruiter" : "Create your account";
}
document.getElementById("tabLogin").addEventListener("click", () => showAuthTab("login"));
document.getElementById("tabRegister").addEventListener("click", () => showAuthTab("register"));
showAuthTab("login");

document.getElementById("loginBtn").addEventListener("click", async () => {
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  if (!username || !password) return toast("Username + password required", true);
  try {
    const res = await fetch(API + "/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return toast(data.detail || "Login failed", true);
    SESSION_TOKEN = data.token;
    localStorage.setItem("tmc_session", SESSION_TOKEN);
    ME = data.user;
    hideSetup();
    boot();
  } catch (e) { toast("Login failed: " + e.message, true); }
});

document.getElementById("regBtn").addEventListener("click", async () => {
  const username = document.getElementById("regUser").value.trim();
  const password = document.getElementById("regPass").value;
  const display_name = document.getElementById("regName").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  if (!username || !password) return toast("Username + password required", true);
  try {
    const res = await fetch(API + "/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, display_name, email }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return toast(data.detail || "Sign-up failed", true);
    if (data.needs_approval) {
      toast("Account created — waiting for admin approval.", false);
      showAuthTab("login");
    } else {
      toast("Account created — signing in…");
      document.getElementById("loginUser").value = username;
      document.getElementById("loginPass").value = password;
      document.getElementById("loginBtn").click();
    }
  } catch (e) { toast("Sign-up failed: " + e.message, true); }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  try { await api("/api/auth/logout", { method: "POST" }); } catch {}
  localStorage.removeItem("tmc_session");
  SESSION_TOKEN = ""; ME = null;
  location.reload();
});

function toast(msg, error = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast visible" + (error ? " error" : "");
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove("visible"), 2600);
}

function esc(s) { if (s === null || s === undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fitClass(s) { if (s == null) return ""; if (s >= 90) return "fit-90"; if (s >= 75) return "fit-75"; if (s >= 60) return "fit-60"; if (s >= 40) return "fit-40"; return "fit-0"; }
function fmtDate(iso) { if (!iso) return ""; return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
function fmtRelative(iso) {
  if (!iso) return "";
  const diff = (new Date(iso) - new Date()) / 86400000;
  if (diff > 1) return `in ${Math.round(diff)}d`;
  if (diff > 0) return "today";
  if (diff > -1) return "yesterday";
  const days = Math.round(-diff);
  if (days < 7) return `${days}d ago`;
  if (days < 31) return `${Math.round(days/7)}w ago`;
  if (days < 365) return `${Math.round(days/30)}mo ago`;
  return `${Math.round(days/365)}y ago`;
}

function fmtOverdue(iso) {
  if (!iso) return "";
  const diff = (new Date(iso) - new Date()) / 86400000;
  if (diff > 1) return `in ${Math.round(diff)}d`;
  if (diff > 0) return "today";
  if (diff > -1) return "yesterday";
  return `${Math.round(-diff)}d overdue`;
}

/* ============ Nav ============ */
document.querySelectorAll(".nav-item[data-view]").forEach(btn => {
  btn.addEventListener("click", () => switchView(btn.dataset.view));
});
document.getElementById("refreshBtn").addEventListener("click", boot);
document.getElementById("exportBtn").addEventListener("click", async () => {
  const headers = {};
  if (SESSION_TOKEN) headers["X-Session-Token"] = SESSION_TOKEN;
  const res = await fetch(API + "/api/export/conversations.xlsx", { headers });
  if (!res.ok) return toast("Export failed", true);
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url;
  a.download = `tmc_export_${new Date().toISOString().slice(0,10)}.xlsx`;
  a.click(); URL.revokeObjectURL(url);
  toast("Excel downloaded");
});
document.getElementById("quickAddBtn").addEventListener("click", openAddCandidateModal);
document.getElementById("paletteBtn").addEventListener("click", openPalette);

async function switchView(view) {
  // Deprecated views — redirect to Inbox (kept to avoid breaking stale onclick handlers)
  if (view === "replies" || view === "followups" || view === "campaigns") view = "dashboard";
  STATE.view = view;
  if (view !== "candidates") STATE.currentCandidate = null;
  if (view !== "roles") STATE.currentRole = null;
  if (view !== "campaigns") STATE.currentCampaign = null;
  document.querySelectorAll(".nav-item[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  const titles = {
    dashboard: ["Inbox", "All captured conversations. Sync via the Chrome extension."],
    candidates: ["People", "Search, filter, enrich, and track every candidate."],
    pools: ["Talent Pools", "Group candidates into reusable pools — by domain, role, seniority."],
    roles: ["Roles", "Paste a JD. We extract must-haves and outreach angles."],
    templates: ["Templates", "Reply building blocks — show up as suggestions in conversations."],
    kanban: ["Pipeline Kanban", "Only people you manually add. Drag between stages."],
    settings: ["Settings", "Your extension key, integrations, and workspace."],
    admin: ["Admin", "Manage users, see usage, approve pending signups."],
  };
  const [title, sub] = titles[view];
  document.getElementById("view-title").textContent = title;
  document.getElementById("view-sub").textContent = sub;
  await renderView();
}

function showModal(html, large = false) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalBg").style.display = "flex";
}
function hideModal() {
  document.getElementById("modalBg").style.display = "none";
  document.getElementById("modalBox").innerHTML = "";
}
document.getElementById("modalBg").addEventListener("click", e => { if (e.target.id === "modalBg") hideModal(); });

/* ============ Boot ============ */
async function boot() {
  if (!SESSION_TOKEN) { showSetup(); return; }
  try {
    const me = await api("/api/auth/me").catch(() => ({ user: null, all_users: [] }));
    ME = me.user; STATE.users = me.all_users || [];
    if (ME) {
      document.getElementById("userChip").textContent = "★ " + (ME.display_name || ME.username);
      document.getElementById("logoutBtn").style.display = "inline-flex";
      const navAdmin = document.getElementById("navAdmin");
      if (navAdmin) navAdmin.style.display = (ME.is_admin ? "flex" : "none");
    }

    // Admins impersonating a teammate: tag stats + candidates with ?as_user_id=X.
    // We drop the flag silently if the user it points to no longer exists.
    if (STATE.viewAsUserId && ME && ME.is_admin) {
      STATE.viewAsUser = (STATE.users || []).find(u => u.id === STATE.viewAsUserId) || null;
      if (!STATE.viewAsUser) {
        STATE.viewAsUserId = null;
        localStorage.removeItem("tmc_view_as");
      }
    } else if (!ME || !ME.is_admin) {
      STATE.viewAsUserId = null;
      STATE.viewAsUser = null;
      localStorage.removeItem("tmc_view_as");
    }

    const q = asUserQS("?");
    const [stats, candidates, roles, templates, pools, settings] = await Promise.all([
      api("/api/stats" + q),
      api("/api/candidates" + q),
      api("/api/roles"),
      api("/api/templates"),
      api("/api/pools"),
      api("/api/settings"),
    ]);
    STATE.stats = stats; STATE.candidates = candidates; STATE.roles = roles;
    STATE.templates = templates; STATE.pools = pools; STATE.settings = settings;
    STATE.replies = []; STATE.tasks = []; STATE.campaigns = [];
    renderNavBadges();
    renderImpersonationBanner();
    await renderView();
  } catch (e) {
    console.error(e);
    toast("Load failed: " + e.message, true);
  }
}

function renderNavBadges() {
  const setBadge = (id, n) => { const el = document.getElementById(id); if (!el) return; el.textContent = n; el.style.display = n ? "inline-block" : "none"; };
  setBadge("nav-badge-roles", (STATE.roles || []).filter(r => r.status === "open").length);
}

function renderImpersonationBanner() {
  const el = document.getElementById("impersonationBanner");
  if (!el) return;
  if (ME && ME.is_admin && STATE.viewAsUserId && STATE.viewAsUser) {
    const u = STATE.viewAsUser;
    el.style.display = "block";
    el.innerHTML = `
      <strong>Viewing as ${esc(u.display_name || u.username)}</strong>
      <span style="color:#7a6a1e;">(@${esc(u.username)}) —
        Inbox, People and Stats are scoped to their data. You are still acting as admin; edits affect real data.</span>
      <button class="btn btn-ghost btn-sm" id="stopImpersonateBtn" style="margin-left:10px;">Back to admin view</button>
    `;
    document.getElementById("stopImpersonateBtn").addEventListener("click", () => setViewAs(null));
  } else {
    el.style.display = "none";
    el.innerHTML = "";
  }
}

async function renderView() {
  const root = document.getElementById("view-root");
  if (!SESSION_TOKEN) { showSetup(); return; }
  switch (STATE.view) {
    case "dashboard":  return renderDashboard(root);
    case "candidates": return renderCandidatesView(root);
    case "pools":      return renderPoolsView(root);
    case "roles":      return renderRolesView(root);
    case "replies":    return renderRepliesView(root);
    case "followups":  return renderFollowupsView(root);
    case "campaigns":  return renderCampaignsView(root);
    case "templates":  return renderTemplatesView(root);
    case "kanban":     return renderKanbanView(root);
    case "settings":   return renderSettingsView(root);
    case "admin":      return renderAdminView(root);
  }
}

/* ============================================================
   VIEW: Dashboard — INBOX-first (WhatsApp/LinkedIn style)
   ============================================================ */
function renderDashboard(root) {
  const s = STATE.stats || {};
  const isFirstRun = (s.total_candidates || 0) === 0 && (s.open_roles || 0) === 0;

  if (isFirstRun) {
    root.innerHTML = renderOnboarding();
    wireOnboarding();
    return;
  }

  // Inbox = candidates with a last_message_at, newest first (already sorted by backend)
  const all = (STATE.candidates || []).slice();
  const inbox = all.filter(c => c.last_message_preview || c.conversation_count > 0);
  const filterMode = STATE.inboxFilter || "all";
  const q = (STATE.inboxQuery || "").toLowerCase().trim();

  let filtered = inbox;
  if (filterMode === "unread")   filtered = filtered.filter(c => !c.last_message_from_me);
  if (filterMode === "sent")     filtered = filtered.filter(c => c.last_message_from_me);
  if (filterMode === "interested") filtered = filtered.filter(c => (c.last_sentiment || "") === "interested");
  if (q) filtered = filtered.filter(c =>
    (c.full_name||"").toLowerCase().includes(q) ||
    (c.headline||"").toLowerCase().includes(q) ||
    (c.current_company||"").toLowerCase().includes(q) ||
    (c.last_message_preview||"").toLowerCase().includes(q)
  );

  const row = (c) => {
    const initials = ((c.full_name||"?").split(/\s+/).map(w=>w[0]||"").slice(0,2).join("")).toUpperCase();
    const when = c.last_message_at ? fmtRelative(c.last_message_at) : "";
    const prev = c.last_message_preview || "";
    const isPlaceholder = prev.indexOf("[No message preview yet") === 0;
    const prefix = (c.last_message_from_me && !isPlaceholder) ? '<span style="color:var(--mute);">You: </span>' : '';
    const unread = !c.last_message_from_me && !!prev && !isPlaceholder;
    const sentChip = c.last_sentiment ? `<span class="chip chip-${sentimentChipClass(c.last_sentiment)}" style="font-size:10px;">${esc(c.last_sentiment.replace("_"," "))}</span>` : "";
    const linkedinHref = (c.profile_url && c.profile_url.indexOf("http") === 0) ? c.profile_url : "";
    const openLiChip = isPlaceholder && linkedinHref
      ? `<a href="${esc(linkedinHref)}" target="_blank" rel="noopener" class="chip chip-outline" style="font-size:10px;text-decoration:none;" onclick="event.stopPropagation();">↗ Open on LinkedIn</a>`
      : "";
    const previewHtml = isPlaceholder
      ? `<div class="inbox-preview" style="color:var(--mute);font-style:italic;">No message body yet — open on LinkedIn to read.</div>`
      : `<div class="inbox-preview">${prefix}${esc(prev || "No messages yet — click to add outreach.")}</div>`;
    return `

  });
  pollAnalysisStatus();
}

let _statusPollTimer = null;
async function pollAnalysisStatus() {
  clearTimeout(_statusPollTimer);
  try {
    const s = await api("/api/analysis/status");
    const chip = document.getElementById("analysisStatusChip");
    if (!chip) return;
    const busy = (s.analyzing || 0) + (s.pending || 0) + (s.inflight || 0);
    if (busy > 0) {
      chip.innerHTML = `<span class="chip chip-warn" style="font-size:10px;">⏳ ${s.analyzing || 0} analyzing · ${s.pending || 0} pending</span>`;
      _statusPollTimer = setTimeout(pollAnalysisStatus, 4000);
    } else if (s.failed) {
      chip.innerHTML = `<span class="chip chip-bad" style="font-size:10px;">${s.failed} failed</span>`;
    } else {
      chip.innerHTML = "";
    }
  } catch (e) {}
}

function sentimentChipClass(s) {
  const map = { interested: "ok", maybe: "warn", not_interested: "bad", no_response: "outline", neutral: "outline" };
  return map[s] || "outline";
}

async function renderCandidatesView(root) {
  const cands = STATE.candidates;
  const sc = (STATE.stats && STATE.stats.stage_counts) || {};
  const f = STATE.candidateFilter;

  const filtered = cands.filter(c => {
    if (f.stage && (c.stage || "New") !== f.stage) return false;
    if (f.location && !(c.location||"").toLowerCase().includes(f.location.toLowerCase())) return false;
    if (f.skill && !JSON.stringify(c.skills||[]).toLowerCase().includes(f.skill.toLowerCase())) return false;
    if (f.pool_id && !(c.pool_ids||[]).includes(parseInt(f.pool_id))) return false;
    if (f.q) {
      const q = f.q.toLowerCase();
      const blob = [c.full_name, c.current_company, c.current_title, c.headline, c.email, ...(c.skills||[])].filter(Boolean).join(" ").toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });

  const stages = ["", "New", "Engaged", "Shortlisted", "Sent", "Replied", "Follow-up Needed", "Closed"];

  root.innerHTML = `
    <div class="split">
      <div class="list-panel">
        <div class="search">

          <input class="input" style="flex:1;min-width:100px;font-size:12px;padding:5px 8px;" placeholder="Skill" id="filtSkill" value="${esc(f.skill)}">
          <select class="input" style="flex:1;min-width:100px;font-size:12px;padding:5px 8px;" id="filtPool">
            <option value="">All pools</option>
            ${STATE.pools.map(p => `<option value="${p.id}" ${f.pool_id == p.id ? 'selected' : ''}>${esc(p.name)} (${p.count})</option>`).join("")}
          </select>
        </div>
        <div class="candidate-list" id="candListPanel">
          ${filtered.length ? filtered.map(c => `
            <div class="candidate-item ${STATE.currentCandidate && STATE.currentCandidate.id === c.id ? 'active' : ''}" data-id="${c.id}">
              <div class="ci-top">
                <div class="ci-name">${esc(c.full_name)}</div>
                <span class="ci-src">${esc(c.source || 'manual')}</span>
              </div>
              <div class="ci-sub">${esc([c.current_title, c.current_company].filter(Boolean).join(" · ") || c.headline || '')}</div>
              <div class="ci-meta"><span>${esc(c.stage || 'New')}</span>${c.location ? `<span>📍 ${esc(c.location)}</span>` : ''}<span>${c.conversation_count} msg</span></div>
              ${(c.skills||[]).length ? `<div style="margin-top:5px;">${(c.skills||[]).slice(0,3).map(s => `<span class="chip" style="font-size:9px;padding:1px 6px;">${esc(s)}</span>`).join(" ")}</div>` : ''}

        </div>
      </div>

  `;

  document.querySelectorAll("#candListPanel .candidate-item").forEach(el => el.addEventListener("click", async () => {
    const id = parseInt(el.dataset.id);
    STATE.currentCandidate = await api(`/api/candidates/${id}`);

  }));
  if (STATE.currentCandidate) wireCandidateDetail(STATE.currentCandidate);

              ${(m.risk_flags||[]).map(r => `<span class="badge-risk">${esc(r)}</span>`).join("")}
            </div>
          </div>`).join("")}
      </div>` : ''}
    ${c.conversations.length ? c.conversations.map(conv => renderConversationBlock(conv, c)).join("") : `<div class="card"><div class="empty">No captured conversations yet. Save one from LinkedIn, or add manually via <strong>Edit</strong>.</div></div>`}
    <div class="card">
      <h3>Private notes</h3>
      <textarea class="textarea" id="notesArea" placeholder="Your private notes about ${esc(c.full_name)}...">${esc(c.notes || "")}</textarea>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      ${STATE.roles.length ? `
        <select id="scoreRoleSelect" class="input" style="max-width:260px;">
          ${STATE.roles.map(r => `<option value="${r.id}">${esc(r.title)}${r.company ? ' · ' + esc(r.company) : ''}</option>`).join("")}
        </select>
        <button class="btn btn-primary" id="scoreCandBtn">Score for this role</button>` : `<div style="font-size:12px;color:var(--mute);">Create a role first to score this candidate against it.</div>`}
    </div>
  `;
}

function renderConversationBlock(conv, c) {
  const latestDraft = conv.drafts && conv.drafts.length ? conv.drafts[conv.drafts.length - 1] : null;
  const analyzed = !!conv.analyzed_at;
  const pickedPoolId = conv.pool_id || conv.suggested_pool_id || "";
  const pickedRoleId = conv.role_id || conv.suggested_role_id || "";
  const poolIsSuggestion = !conv.pool_id && conv.suggested_pool_id;
  const roleIsSuggestion = !conv.role_id && conv.suggested_role_id;

  const poolOptions = `<option value="">(no pool)</option>` +
    (STATE.pools || []).map(p => `<option value="${p.id}" ${String(p.id) === String(pickedPoolId) ? 'selected' : ''}>${esc(p.name)}</option>`).join("");
  const roleOptions = `<option value="">(no role)</option>` +
    (STATE.roles || []).map(r => `<option value="${r.id}" ${String(r.id) === String(pickedRoleId) ? 'selected' : ''}>${esc(r.title)}${r.company ? ' · ' + esc(r.company) : ''}</option>`).join("");

  // Show up to 3 template quick-suggestions
  const suggestTmpls = (STATE.templates || []).slice(0, 3);

  // Analysis status badge (pending / analyzing / done / failed)
  const analysisStatus = (conv.analysis_status || (analyzed ? 'done' : 'pending')).toLowerCase();
  const statusBadge = (() => {
    if (analysisStatus === 'analyzing') return `<span class="chip chip-warn" style="margin-left:6px;">⏳ analyzing…</span>`;
    if (analysisStatus === 'pending')   return `<span class="chip chip-outline" style="margin-left:6px;">queued for brief</span>`;
    if (analysisStatus === 'failed')    return `<span class="chip chip-bad" style="margin-left:6px;" title="${esc(conv.analysis_error||'')}">! analysis failed</span>`;
    return '';
  })();

  return `
    <div class="card" data-conv-id="${conv.id}">
      <h3 style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <span>Conversation · ${fmtDate(conv.captured_at)} · ${conv.message_count} messages ${conv.source ? `<span class="chip chip-outline" style="margin-left:6px;">${esc(conv.source)}</span>` : ''}${statusBadge}</span>
        <button class="btn btn-sm btn-gold conv-analyze" title="Re-run AI: person brief + conversation brief + pool/role suggestions">${analyzed ? '↻ Re-brief' : '✨ Brief this'}</button>
      </h3>

      ${conv.summary ? `<div style="padding:10px 12px;background:var(--tmc-paper-2);border-left:3px solid var(--tmc-gold);border-radius:0 8px 8px 0;margin-bottom:10px;">
        <div style="font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;">Conversation brief</div>
        <div style="font-size:13px;">${esc(conv.summary)}</div>
        ${conv.sentiment ? `<span class="chip chip-navy" style="margin-top:6px;">${esc(conv.sentiment.replace('_',' '))}</span>` : ''}
      </div>` : ''}

      ${conv.person_brief ? `<div style="padding:10px 12px;background:var(--tmc-paper-2);border-left:3px solid var(--tmc-navy);border-radius:0 8px 8px 0;margin-bottom:10px;">
        <div style="font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;">About the person</div>
        <div style="font-size:13px;">${esc(conv.person_brief)}</div>
      </div>` : ''}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div>
          <label class="label" style="display:flex;align-items:center;gap:6px;">Pool ${poolIsSuggestion ? '<span class="chip chip-warn" style="font-size:9px;">suggested</span>' : ''}</label>
          <select class="input conv-pool-sel">${poolOptions}</select>
        </div>
        <div>
          <label class="label" style="display:flex;align-items:center;gap:6px;">Role ${roleIsSuggestion ? '<span class="chip chip-warn" style="font-size:9px;">suggested</span>' : ''}</label>
          <select class="input conv-role-sel">${roleOptions}</select>
        </div>
      </div>

      <div style="margin-bottom:10px;">
        ${conv.messages.map(m => { const fromRec = (m.from_me !== undefined ? m.from_me : (m.sender || "").toLowerCase() === "you"); const when = m.timestamp ? fmtRelative(m.timestamp) : ""; return `<div class="msg ${fromRec ? 'msg-recruiter' : 'msg-candidate'}"><div class="msg-sender">${esc(m.sender)}${when ? ` <span style="font-weight:400;color:var(--mute);font-size:10px;margin-left:6px;">· ${esc(when)}</span>` : ''}</div><div class="msg-body">${esc(m.body)}</div></div>`; }).join("")}
      </div>
      <div class="draft-box">
        <strong style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tmc-gold);">Reply</strong>
        <div class="tone-row" style="margin-top:8px;">
          <button class="chip active" data-tone="professional">Professional</button>
          <button class="chip" data-tone="friendly">Friendly</button>
          <button class="chip" data-tone="brief and direct">Brief</button>
        </div>
        ${suggestTmpls.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">
          <span style="font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;align-self:center;">Template:</span>
          ${suggestTmpls.map(t => `<button class="chip chip-outline conv-tmpl-quick" data-tmpl-id="${t.id}" title="Use '${esc(t.name)}' to draft">${esc(t.name)}</button>`).join("")}
          <button class="chip chip-outline conv-tmpl-more" title="More templates…">More…</button>
        </div>` : ''}
        <textarea class="draft-textarea" placeholder="Click 'Generate' for an AI reply, or type your own.">${esc(latestDraft ? latestDraft.draft_text : '')}</textarea>
        <div class="draft-actions">
          <button class="btn btn-gold draft-generate">Generate</button>
          <button class="btn draft-copy">Copy</button>
          <button class="btn btn-ghost draft-approve" ${latestDraft && latestDraft.approved ? 'disabled' : ''}>${latestDraft && latestDraft.approved ? '✓ Approved' : 'Approve'}</button>
        </div>
      </div>
    </div>
  `;
}

function wireCandidateDetail(c) {
  const detail = document.getElementById("candDetail");
  if (!detail) return;

  detail.querySelector("#stageSelect").addEventListener("change", async e => {
    await api(`/api/candidates/${c.id}`, { method: "PATCH", body: JSON.stringify({ stage: e.target.value }) });
    toast("Stage updated"); await boot();
  });

  // Inline edit on full name
  const nameEl = detail.querySelector(".profile-name");
  nameEl.addEventListener("blur", async () => {
    const newVal = nameEl.textContent.trim();
    if (!newVal || newVal === c.full_name) return;
    await api(`/api/candidates/${c.id}`, { method: "PATCH", body: JSON.stringify({ full_name: newVal }) });
    toast("Name updated");
  });

  const notesArea = detail.querySelector("#notesArea");
  if (notesArea) {
    let t; notesArea.addEventListener("input", e => { clearTimeout(t); t = setTimeout(async () => { await api(`/api/candidates/${c.id}`, { method: "PATCH", body: JSON.stringify({ notes: e.target.value }) }); toast("Notes saved"); }, 800); });
  }

  const briefBtn = detail.querySelector("#briefBtn");
  briefBtn.addEventListener("click", async () => {
    briefBtn.disabled = true; briefBtn.innerHTML = '<span class="spinner"></span> Writing...';
    try {
      const b = await api(`/api/candidates/${c.id}/brief`, { method: "POST" });
      const holder = detail.querySelector("#briefHolder");
      holder.innerHTML = `
        <div class="card">
          <h2>AI Brief for Hiring Manager <button class="btn btn-sm btn-ghost" onclick="navigator.clipboard.writeText(this.parentNode.parentNode.querySelector('.brief-intro').textContent);toast('Copied')">Copy intro</button></h2>
          <div class="brief-intro" style="font-size:14px;line-height:1.6;padding:12px;background:var(--tmc-paper-2);border-left:3px solid var(--tmc-gold);border-radius:0 8px 8px 0;margin-bottom:12px;">${esc(b.intro || '')}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><h3>Strengths</h3>${(b.strengths||[]).map(x => `<div style="font-size:12px;margin-bottom:4px;">✓ ${esc(x)}</div>`).join("")}</div>
            <div><h3>Risks</h3>${(b.risks||[]).map(x => `<div style="font-size:12px;margin-bottom:4px;color:var(--bad);">△ ${esc(x)}</div>`).join("") || '<div style="font-size:12px;color:var(--mute);">None flagged.</div>'}</div>
          </div>
          ${(b.missing||[]).length ? `<div style="margin-top:12px;"><h3>Data to collect</h3>${(b.missing||[]).map(x => `<span class="chip chip-warn">?  ${esc(x)}</span>`).join(" ")}</div>` : ''}
          ${b.next_action ? `<div style="margin-top:12px;padding:10px;background:var(--tmc-navy);color:var(--tmc-paper);border-radius:8px;font-size:13px;"><strong style="color:var(--tmc-gold);">Next:</strong> ${esc(b.next_action)}</div>` : ''}
        </div>`;
    } catch (e) { toast("Brief failed: " + e.message, true); }
    finally { briefBtn.disabled = false; briefBtn.innerHTML = '✨ AI brief'; }
  });

  detail.querySelector("#editCandBtn").addEventListener("click", () => openEditCandidateModal(c));
  detail.querySelector("#pushAtsBtn").addEventListener("click", () => openAtsPushModal(c));

  const scoreBtn = detail.querySelector("#scoreCandBtn");
  if (scoreBtn) scoreBtn.addEventListener("click", async () => {
    const roleId = parseInt(detail.querySelector("#scoreRoleSelect").value);
    scoreBtn.disabled = true; scoreBtn.innerHTML = '<span class="spinner"></span> Scoring...';
    try {
      await api(`/api/roles/${roleId}/score`, { method: "POST", body: JSON.stringify({ candidate_id: c.id }) });
      STATE.currentCandidate = await api(`/api/candidates/${c.id}`);
      toast("Scored");
      await renderCandidatesView(document.getElementById("view-root"));
    } catch (e) { toast("Scoring failed: " + e.message, true); }
    finally { scoreBtn.disabled = false; scoreBtn.textContent = "Score for this role"; }
  });

  c.conversations.forEach(conv => {
    const scope = detail.querySelector(`[data-conv-id="${conv.id}"]`);
    if (!scope) return;
    const draftScope = scope.querySelector(".draft-box");

    // --- Analyze (re-)run
    const analyzeBtn = scope.querySelector(".conv-analyze");
    if (analyzeBtn) analyzeBtn.addEventListener("click", async () => {
      const original = analyzeBtn.innerHTML;
      analyzeBtn.disabled = true; analyzeBtn.innerHTML = '<span class="spinner"></span> Analyzing…';
      try {
        await api(`/api/conversations/${conv.id}/analyze?force=true`, { method: "POST" });
        STATE.currentCandidate = await api(`/api/candidates/${c.id}`);
        await renderCandidatesView(document.getElementById("view-root"));
        toast("Analyzed");
      } catch (e) { toast("Analyze failed: " + e.message, true); }
      finally { analyzeBtn.disabled = false; analyzeBtn.innerHTML = original; }
    });

    // --- Pool + role selects (recruiter override for this conversation)
    const poolSel = scope.querySelector(".conv-pool-sel");
    const roleSel = scope.querySelector(".conv-role-sel");
    async function patchMeta(body) {
      try {
        await api(`/api/conversations/${conv.id}/meta`, { method: "PATCH", body: JSON.stringify(body) });
        toast("Saved");
        STATE.currentCandidate = await api(`/api/candidates/${c.id}`);
      } catch (e) { toast("Save failed: " + e.message, true); }
    }
    if (poolSel) poolSel.addEventListener("change", e => {
      const v = e.target.value;
      patchMeta(v ? { pool_id: parseInt(v) } : { clear_pool: true });
    });
    if (roleSel) roleSel.addEventListener("change", e => {
      const v = e.target.value;
      patchMeta(v ? { role_id: parseInt(v) } : { clear_role: true });
    });

    // --- Tone chips
    draftScope.querySelectorAll(".tone-row .chip").forEach(chip => chip.addEventListener("click", () => {
      draftScope.querySelectorAll(".tone-row .chip").forEach(x => x.classList.remove("active"));
      chip.classList.add("active");
    }));

    // --- Generate reply (Claude)
    draftScope.querySelector(".draft-generate").addEventListener("click", async () => {
      const tone = draftScope.querySelector(".tone-row .chip.active").dataset.tone;
      const btn = draftScope.querySelector(".draft-generate");
      const textarea = draftScope.querySelector(".draft-textarea");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        const res = await api(`/api/conversations/${conv.id}/draft`, { method: "POST", body: JSON.stringify({ tone, goal: "continue the conversation and move toward a call" }) });
        textarea.value = res.draft_text;
        textarea.dataset.draftId = res.draft_id;
        toast("Draft generated");
      } catch (e) { toast("Draft failed: " + e.message, true); }
      finally { btn.disabled = false; btn.textContent = "Generate"; }
    });

    // --- Copy / approve
    draftScope.querySelector(".draft-copy").addEventListener("click", async () => {
      const text = draftScope.querySelector(".draft-textarea").value;
      if (!text) return toast("Nothing to copy", true);
      await navigator.clipboard.writeText(text);
      toast("Copied");
    });
    draftScope.querySelector(".draft-approve").addEventListener("click", async () => {
      const draftId = draftScope.querySelector(".draft-textarea").dataset.draftId;
      if (!draftId) return toast("Generate a draft first", true);
      await api(`/api/drafts/${draftId}/approve`, { method: "POST", body: JSON.stringify({ approved: true }) });
      draftScope.querySelector(".draft-approve").textContent = "✓ Approved";
      draftScope.querySelector(".draft-approve").disabled = true;
      toast("Approved");
    });

    // --- Quick template suggestions
    draftScope.querySelectorAll(".conv-tmpl-quick").forEach(btn => btn.addEventListener("click", async () => {
      const tid = parseInt(btn.dataset.tmplId);
      const tone = draftScope.querySelector(".tone-row .chip.active")?.dataset.tone || "professional";
      btn.classList.add("active");
      try {
        const res = await api("/api/templates/draft", { method: "POST", body: JSON.stringify({ template_id: tid, candidate_id: c.id, tone }) });
        draftScope.querySelector(".draft-textarea").value = res.draft_text;
        toast("Template applied");
      } catch (e) { toast("Template failed: " + e.message, true); }
      finally { btn.classList.remove("active"); }
    }));
    const moreBtn = draftScope.querySelector(".conv-tmpl-more");
    if (moreBtn) moreBtn.addEventListener("click", () => openTemplatePickerForDraft(c, draftScope));
  });
}

window.enrichCandidate = async function(id) {
  if (!(STATE.settings?.apify_api_key?.set || STATE.settings?.proxycurl_api_key?.set)) { toast("Add your Apify key in Settings first", true); switchView("settings"); return; }
  try {
    toast("Calling Apify...");
    await api("/api/candidates/enrich", { method: "POST", body: JSON.stringify({ candidate_id: id }) });
    STATE.currentCandidate = await api(`/api/candidates/${id}`);
    toast("Enriched");
    await boot();
  } catch (e) { toast("Enrich failed: " + e.message, true); }
};

    else if (tab === "csv") body.innerHTML = `
      <p style="font-size:13px;">Upload a CSV with columns like <code>full_name, linkedin_url, email, title, company, location, skills, languages, tags, pool</code>. Missing columns are fine.</p>
      <input type="file" id="csv_file" accept=".csv" class="input" style="margin-bottom:14px;">
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="hideModal()">Cancel</button>
        <button class="btn btn-primary" id="csv_go">Import</button>
      </div>`;
    wireTab(tab);
  }
  function wireTab(tab) {
    if (tab === "form") {
      document.getElementById("f_save").addEventListener("click", async () => {
        const name = document.getElementById("f_name").value.trim();
        if (!name) return toast("Name required", true);
        const payload = {
          full_name: name,
          profile_url: document.getElementById("f_url").value.trim(),
          email: document.getElementById("f_email").value.trim(),
          phone: document.getElementById("f_phone").value.trim(),
          current_title: document.getElementById("f_title").value.trim(),
          current_company: document.getElementById("f_company").value.trim(),
          location: document.getElementById("f_location").value.trim(),
          years_experience: parseInt(document.getElementById("f_years").value) || null,
          visa_status: document.getElementById("f_visa").value.trim(),
          salary_expectation: document.getElementById("f_salary").value.trim(),
          skills: document.getElementById("f_skills").value.split(",").map(s => s.trim()).filter(Boolean),
          languages: document.getElementById("f_langs").value.split(",").map(s => s.trim()).filter(Boolean),
          tags: document.getElementById("f_tags").value.split(",").map(s => s.trim()).filter(Boolean),
          about: document.getElementById("f_about").value,
          conversation_transcript: document.getElementById("f_conv").value,
          open_to_relocation: document.getElementById("f_relo").checked,
          source: "manual",
        };
        try {
          const res = await api("/api/candidates/create", { method: "POST", body: JSON.stringify(payload) });
          hideModal(); toast("Candidate created");
          STATE.currentCandidate = await api(`/api/candidates/${res.id}`);
          STATE.view = "candidates";
          await boot();
        } catch (e) { toast("Failed: " + e.message, true); }
      });
    } else if (tab === "linkedin") {
      document.getElementById("lu_save").addEventListener("click", async () => {
        const url = document.getElementById("lu_url").value.trim();
        if (!url) return toast("URL required", true);
        const btn = document.getElementById("lu_save");
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Calling Apify...';
        try {
          const res = await api("/api/candidates/enrich", { method: "POST", body: JSON.stringify({ linkedin_url: url }) });
          hideModal(); toast("Enriched");
          STATE.currentCandidate = await api(`/api/candidates/${res.id}`);
          STATE.view = "candidates";
          await boot();
        } catch (e) { toast("Failed: " + e.message, true); btn.disabled = false; btn.innerHTML = '✨ Enrich'; }
      });
    } else if (tab === "csv") {
      document.getElementById("csv_go").addEventListener("click", async () => {
        const file = document.getElementById("csv_file").files[0];
        if (!file) return toast("Pick a file", true);
        const btn = document.getElementById("csv_go"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
        const form = new FormData(); form.append("file", file);
        const headers = {}; if (SESSION_TOKEN) headers["X-Session-Token"] = SESSION_TOKEN;
        try {
          const r = await fetch(API + "/api/candidates/import_csv", { method: "POST", headers, body: form });
          const j = await r.json();
          if (!r.ok) throw new Error(j.detail || "Failed");
          hideModal(); toast(`Imported: ${j.created} new · ${j.updated} updated · ${j.failed} failed`);
          await boot();
        } catch (e) { toast("Import failed: " + e.message, true); btn.disabled = false; btn.textContent = "Import"; }
      });
    }
  }

  document.querySelectorAll("[data-tab]").forEach(el => el.addEventListener("click", () => renderTab(el.dataset.tab)));
  renderTab("form");
}

/* ============================================================
   VIEW: Kanban
   ============================================================ */
async function renderKanbanView(root) {
  const stages = ["New","Engaged","Shortlisted","Sent","Replied","Follow-up Needed","Closed"];
  // Only show candidates the recruiter has explicitly added to the board
  const onBoard = (STATE.candidates || []).filter(c => c.in_kanban);
  // People with conversations, not yet on the board — pickable in the dropdown
  const addable = (STATE.candidates || []).filter(c => !c.in_kanban && (c.conversation_count || 0) > 0);

  const byStage = {}; stages.forEach(s => byStage[s] = []);
  onBoard.forEach(c => { const s = stages.includes(c.stage) ? c.stage : "New"; byStage[s].push(c); });

  root.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">
      <div style="font-size:12px;color:var(--mute);">${onBoard.length} on board · ${addable.length} people with conversations available</div>
      <div style="flex:1;"></div>
      <select id="kanbanAddSel" class="input" style="max-width:320px;">
        <option value="">+ Add a person to the board…</option>
        ${addable.map(c => `<option value="${c.id}">${esc(c.full_name)}${c.current_company ? ' · ' + esc(c.current_company) : ''}</option>`).join("")}
      </select>
      <button class="btn btn-gold btn-sm" id="kanbanAddBtn">Add</button>
    </div>
    <div class="kanban">${stages.map(s => `
      <div class="kanban-col" data-stage="${esc(s)}">
        <h3>${esc(s)} <span class="count">${byStage[s].length}</span></h3>
        ${byStage[s].map(c => `<div class="kanban-card" draggable="true" data-id="${c.id}">
          <button class="kc-remove" data-remove-id="${c.id}" title="Remove from board">×</button>
          <div class="kc-name">${esc(c.full_name)}</div>
          <div class="kc-sub">${esc([c.current_title, c.current_company].filter(Boolean).join(" · ") || c.headline || '')}</div>
        </div>`).join("")}
      </div>`).join("")}
    </div>`;

  // --- Add person
  document.getElementById("kanbanAddBtn").addEventListener("click", async () => {
    const v = document.getElementById("kanbanAddSel").value;
    if (!v) return toast("Pick a person first", true);
    try {
      await api(`/api/candidates/${v}/kanban`, { method: "PATCH", body: JSON.stringify({ in_kanban: true }) });
      toast("Added to board");
      await boot();
    } catch (e) { toast("Add failed: " + e.message, true); }
  });

  // --- Remove (× button) — stopPropagation so it doesn't trigger the card click
  document.querySelectorAll("[data-remove-id]").forEach(btn => btn.addEventListener("click", async (e) => {
    e.stopPropagation();
    try {
      await api(`/api/candidates/${btn.dataset.removeId}/kanban`, { method: "PATCH", body: JSON.stringify({ in_kanban: false }) });
      toast("Removed from board");
      await boot();
    } catch (err) { toast("Remove failed: " + err.message, true); }
  }));

  let dragCardId = null;
  document.querySelectorAll(".kanban-card").forEach(card => {
    card.addEventListener("dragstart", e => { dragCardId = card.dataset.id; card.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
    card.addEventListener("dragend", () => card.classList.remove("dragging"));
    card.addEventListener("click", async (e) => {
      if (e.target.closest("[data-remove-id]")) return;
      STATE.currentCandidate = await api(`/api/candidates/${card.dataset.id}`);
      switchView("candidates");
    });
  });
  document.querySelectorAll(".kanban-col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drag-over"); });
    col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
    col.addEventListener("drop", async e => {
      e.preventDefault(); col.classList.remove("drag-over");
      if (!dragCardId) return;
      try { await api(`/api/candidates/${dragCardId}`, { method: "PATCH", body: JSON.stringify({ stage: col.dataset.stage }) }); toast(`Moved to ${col.dataset.stage}`); await boot(); }
      catch (e) { toast("Failed: " + e.message, true); }
    });
  });
}
